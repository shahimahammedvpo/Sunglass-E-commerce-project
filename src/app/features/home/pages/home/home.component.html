
<!-- Hero Section -->
<app-hero-banner></app-hero-banner>

<!-- Category Section -->
<app-category-section></app-category-section>

<!-- Loading -->
@if (loading) {
  <div class="text-center p-5">
    <h4>Loading products...</h4>
  </div>
}

<!-- Error -->
@if (error) {
  <div class="alert alert-danger">
    {{ error }}
  </div>
}

@if (!loading && !error) {

 

  <!-- Trending Products -->
  <app-trending-products
    [products]="trendingProducts">
  </app-trending-products>

  

}
